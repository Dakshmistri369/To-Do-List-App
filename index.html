<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A professional, feature-rich To-Do List app to manage your tasks efficiently with categories, priorities, and deadlines." />
  <title>Taskify – Pro To-Do App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Particles Background ── -->
  <div class="particles" id="particles"></div>

  <!-- ── App Shell ── -->
  <div class="app-shell">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 11L12 14L22 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12V19C21 20.1046 20.1046 21 19 21H5C3.89543 21 3 20.1046 3 19V5C3 3.89543 3.89543 3 5 3H16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-name">Taskify</span>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-label">Views</p>
        <button class="nav-item active" data-filter="all" id="nav-all">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/></svg>
          All Tasks
          <span class="nav-badge" id="badge-all">0</span>
        </button>
        <button class="nav-item" data-filter="today" id="nav-today">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 2V6M8 2V6M3 10H21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Today
          <span class="nav-badge" id="badge-today">0</span>
        </button>
        <button class="nav-item" data-filter="upcoming" id="nav-upcoming">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Upcoming
          <span class="nav-badge" id="badge-upcoming">0</span>
        </button>
        <button class="nav-item" data-filter="completed" id="nav-completed">
          <svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Completed
          <span class="nav-badge" id="badge-completed">0</span>
        </button>

        <p class="nav-label">Priority</p>
        <button class="nav-item" data-filter="high" id="nav-high">
          <span class="priority-dot high"></span> High Priority
          <span class="nav-badge" id="badge-high">0</span>
        </button>
        <button class="nav-item" data-filter="medium" id="nav-medium">
          <span class="priority-dot medium"></span> Medium
          <span class="nav-badge" id="badge-medium">0</span>
        </button>
        <button class="nav-item" data-filter="low" id="nav-low">
          <span class="priority-dot low"></span> Low
          <span class="nav-badge" id="badge-low">0</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="progress-wrap">
          <div class="progress-header">
            <span>Daily Progress</span>
            <span id="progress-pct">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ── Main Content ── -->
    <main class="main-content">

      <!-- ── Top Bar ── -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" id="hamburger" aria-label="Toggle sidebar">
            <span></span><span></span><span></span>
          </button>
          <div class="topbar-title">
            <h1 id="view-title">All Tasks</h1>
            <p class="topbar-date" id="topbar-date"></p>
          </div>
        </div>
        <div class="topbar-right">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input type="text" id="search-input" placeholder="Search tasks…" aria-label="Search tasks" />
          </div>
          <button class="btn-add-task" id="btn-add-task" aria-label="Add new task">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
            New Task
          </button>
        </div>
      </header>

      <!-- ── Stats Bar ── -->
      <div class="stats-bar">
        <div class="stat-card" id="stat-total">
          <div class="stat-icon purple"><svg viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 000 4h6a2 2 0 000-4M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div><p class="stat-value" id="sv-total">0</p><p class="stat-label">Total</p></div>
        </div>
        <div class="stat-card" id="stat-done">
          <div class="stat-icon green"><svg viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17L4 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div><p class="stat-value" id="sv-done">0</p><p class="stat-label">Done</p></div>
        </div>
        <div class="stat-card" id="stat-pending">
          <div class="stat-icon orange"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7V12L15 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div><p class="stat-value" id="sv-pending">0</p><p class="stat-label">Pending</p></div>
        </div>
        <div class="stat-card" id="stat-overdue">
          <div class="stat-icon red"><svg viewBox="0 0 24 24" fill="none"><path d="M12 9V13M12 17H12.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
          <div><p class="stat-value" id="sv-overdue">0</p><p class="stat-label">Overdue</p></div>
        </div>
      </div>

      <!-- ── Sort/Filter Controls ── -->
      <div class="controls-row">
        <div class="sort-wrap">
          <label for="sort-select">Sort by</label>
          <select id="sort-select" aria-label="Sort tasks">
            <option value="created">Date Created</option>
            <option value="due">Due Date</option>
            <option value="priority">Priority</option>
            <option value="alpha">Alphabetical</option>
          </select>
        </div>
        <div class="filter-tags">
          <button class="tag-btn active" data-tag="all" id="tag-all">All</button>
          <button class="tag-btn" data-tag="work" id="tag-work">💼 Work</button>
          <button class="tag-btn" data-tag="personal" id="tag-personal">🏠 Personal</button>
          <button class="tag-btn" data-tag="health" id="tag-health">❤️ Health</button>
          <button class="tag-btn" data-tag="learning" id="tag-learning">📚 Learning</button>
        </div>
      </div>

      <!-- ── Task List ── -->
      <div class="task-list" id="task-list" role="list">
        <!-- Tasks rendered by JS -->
      </div>

      <div class="empty-state" id="empty-state" style="display:none">
        <div class="empty-icon">
          <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="55" stroke="url(#eg)" stroke-width="2" stroke-dasharray="6 4"/>
            <path d="M40 55L55 70L80 45" stroke="url(#eg2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="eg" x1="5" y1="5" x2="115" y2="115" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
              </linearGradient>
              <linearGradient id="eg2" x1="40" y1="45" x2="80" y2="70" gradientUnits="userSpaceOnUse">
                <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#38bdf8"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h3>No tasks here!</h3>
        <p>Click <strong>+ New Task</strong> to add your first task.</p>
      </div>
    </main>
  </div>

  <!-- ── Add / Edit Task Modal ── -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Task form">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">New Task</h2>
        <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="task-title-input">Task Title *</label>
          <input type="text" id="task-title-input" placeholder="What needs to be done?" maxlength="120" />
          <span class="char-count" id="char-count">0 / 120</span>
        </div>
        <div class="form-group">
          <label for="task-desc-input">Description</label>
          <textarea id="task-desc-input" placeholder="Add more details…" rows="3"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group half">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">🟢 Low</option>
              <option value="medium" selected>🟡 Medium</option>
              <option value="high">🔴 High</option>
            </select>
          </div>
          <div class="form-group half">
            <label for="task-category">Category</label>
            <select id="task-category">
              <option value="work">💼 Work</option>
              <option value="personal">🏠 Personal</option>
              <option value="health">❤️ Health</option>
              <option value="learning">📚 Learning</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="task-due">Due Date</label>
          <input type="date" id="task-due" />
        </div>
        <div class="form-group">
          <label for="task-subtasks">Sub-tasks (one per line)</label>
          <textarea id="task-subtasks" placeholder="e.g. Research&#10;Draft&#10;Review" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btn-cancel">Cancel</button>
        <button class="btn-primary" id="btn-save">Save Task</button>
      </div>
    </div>
  </div>

  <!-- ── Delete Confirm Modal ── -->
  <div class="modal-overlay" id="confirm-overlay">
    <div class="modal confirm-modal">
      <div class="confirm-icon">
        <svg viewBox="0 0 24 24" fill="none"><path d="M3 6H21M8 6V4H16V6M19 6L18 20H6L5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h3>Delete Task?</h3>
      <p>This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn-secondary" id="confirm-cancel">Cancel</button>
        <button class="btn-danger" id="confirm-delete">Delete</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
